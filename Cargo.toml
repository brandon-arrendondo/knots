[package]
name = "knots"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "C/C++/Rust/Python/JavaScript/TypeScript/Ada/Go/Java/C#/Kotlin/Swift/PHP complexity analyzer with AI cost metrics (AIRD, AICP), SARIF/JSON/CSV output, and CI threshold enforcement"

[[bin]]
name = "knots"
path = "src/main.rs"

[lib]
name = "knots"
path = "src/lib.rs"

[dependencies]
# Language detection + tree-sitter grammar dispatch live in the shared substrate;
# knots reaches every grammar transitively through it (no direct grammar deps).
lang-parsing-substrate.workspace = true
tree-sitter.workspace = true
anyhow.workspace = true
clap.workspace = true
ignore.workspace = true
globset.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
rayon.workspace = true
toml = "0.8"

[workspace]
members = [
    "knots-test-complexity",
]
resolver = "2"

[workspace.package]
version = "1.15.0"
edition = "2021"
license = "MIT"
authors = ["Brandon Arrendondo <brandon.arrendondo@bissell.com>"]
repository = "https://github.com/brandon-arrendondo/knots"
homepage = "https://github.com/brandon-arrendondo/knots"
readme = "README.md"
keywords = ["complexity", "cyclomatic", "cognitive", "static-analysis", "typescript"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
lang-parsing-substrate = "0.4.0"
tree-sitter = "0.25"
tree-sitter-ada = "0.1"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-swift = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-php = "0.24"
tree-sitter-fortran = "0.6"
tree-sitter-scala = "0.26"
tree-sitter-lua = "0.5"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.0"
regex = "1.10"
ignore = "0.4"
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
rayon = "1.10"
