[package]
name = "knots"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "C/C++/Rust/Python/JavaScript complexity analyzer with AI cost metrics (AIRD, AICP), SARIF/JSON/CSV output, and CI threshold enforcement"

[[bin]]
name = "knots"
path = "src/main.rs"

[lib]
name = "knots"
path = "src/lib.rs"

[dependencies]
tree-sitter.workspace = true
tree-sitter-c.workspace = true
tree-sitter-cpp.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-python.workspace = true
tree-sitter-javascript.workspace = true
anyhow.workspace = true
clap.workspace = true
walkdir.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true

[workspace]
members = [
    "knots-test-complexity",
]
resolver = "2"

[workspace.package]
version = "1.9.0"
edition = "2021"
license = "MIT"
authors = ["Brandon Arrendondo <brandon.arrendondo@bissell.com>"]
repository = "https://github.com/brandon-arrendondo/knots"
homepage = "https://github.com/brandon-arrendondo/knots"
readme = "README.md"
keywords = ["complexity", "cyclomatic", "cognitive", "static-analysis", "javascript"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
tree-sitter = "0.22"
tree-sitter-c = "0.21"
tree-sitter-cpp = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.0"
regex = "1.10"
walkdir = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
