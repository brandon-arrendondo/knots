# Example .pre-commit-config.yaml for knots
#
# Copy this to your project as .pre-commit-config.yaml
# Then run: pre-commit install
#
# See https://pre-commit.com for more information
# knots supports multiple languages — see docs for the current list

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-yaml

  # Code complexity checking with knots
  # pre-commit will automatically build and install knots from source.
  # If your team already has knots on PATH (released binary / package manager),
  # use id: knots-system instead to skip the Rust toolchain requirement.
  - repo: https://github.com/brandon-arrendondo/knots
    rev: v1.10.0
    hooks:
      # -----------------------------------------------------------------------
      # All supported languages — default gate: AIRD ≤ 85
      # Override thresholds via args: (pre-commit replaces args, so you get
      # full additive and subtractive control with no duplicate-flag quirks)
      # -----------------------------------------------------------------------
      - id: knots

      # -----------------------------------------------------------------------
      # Custom thresholds — replaces the default args entirely
      # -----------------------------------------------------------------------
      # - id: knots
      #   args:
      #     - --mccabe-threshold=20
      #     - --cognitive-threshold=15
      #     - --nesting-threshold=7

      # -----------------------------------------------------------------------
      # AIRD-only gate (recommended for most teams)
      # -----------------------------------------------------------------------
      # - id: knots
      #   args: [--aird-threshold=85]

      # -----------------------------------------------------------------------
      # C / C++ projects — restrict to those file types only
      # -----------------------------------------------------------------------
      # - id: knots
      #   types_or: [c, c++]
      #   exclude: ^(Drivers/|Middlewares/)  # Exclude vendor/generated code

      # -----------------------------------------------------------------------
      # Rust projects
      # -----------------------------------------------------------------------
      # - id: knots
      #   types: [rust]
      #   exclude: ^(target/|build\.rs$)

      # -----------------------------------------------------------------------
      # Python projects
      # -----------------------------------------------------------------------
      # - id: knots
      #   types: [python]
      #   exclude: ^(migrations/|setup\.py$)

      # -----------------------------------------------------------------------
      # JavaScript projects
      # -----------------------------------------------------------------------
      # - id: knots
      #   types: [javascript]
      #   exclude: ^(node_modules/|dist/|build/)

      # -----------------------------------------------------------------------
      # Verbose output (shows per-function detail for all files)
      # -----------------------------------------------------------------------
      # - id: knots-verbose

      # -----------------------------------------------------------------------
      # Strict checking (McCabe: 10, Cognitive: 10, Nesting: 3, SLOC: 30,
      #                  ABC: 5.0, Returns: 3) — fully baked, not overridable
      # -----------------------------------------------------------------------
      # - id: knots-strict

      # -----------------------------------------------------------------------
      # system variants — use when knots is already on PATH.
      # No Rust toolchain install required; ideal for C-only shops or teams
      # that distribute knots via a released binary.
      # -----------------------------------------------------------------------
      # - id: knots-system
      # - id: knots-system-strict

      # -----------------------------------------------------------------------
      # Test quality validation (C/C++ Ceedling projects)
      # Parses TEST_SOURCE_FILE("path/to/source.c") from test files
      # Customize --test-dir for your test directory (Test/test/Tests/etc)
      # -----------------------------------------------------------------------
      # - id: test-complexity
      #   args:
      #     - --threshold=0.70
      #     - --boundary-threshold=0.80
      #     - --level=error
      #     - --framework=ceedling
      #     - --test-dir=Test

# Configuration for pre-commit.ci (if using)
ci:
  autofix_commit_msg: 'ci: auto fixes from pre-commit hooks'
  autoupdate_commit_msg: 'ci: pre-commit autoupdate'
