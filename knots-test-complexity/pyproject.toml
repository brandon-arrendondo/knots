[build-system]
requires = ["maturin>=1.9.3,<2.0"]
build-backend = "maturin"

[project]
name = "knots-test-complexity"
description = "Test quality analyzer — validates unit tests have sufficient complexity and boundary coverage (companion to knots)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE-MIT"]
requires-python = ">=3.8"
authors = [{ name = "Brandon Arrendondo" }]
keywords = ["testing", "complexity", "static-analysis", "coverage"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/brandon-arrendondo/knots"
Repository = "https://github.com/brandon-arrendondo/knots"

# Standalone CLI: the `knots-test-complexity` binary is installed onto PATH.
[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
