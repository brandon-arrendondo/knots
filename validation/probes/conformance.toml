# Every known place where knots departs from a metric's published definition
# (docs/adr/0001-the-definition-is-the-authority.md). tests/probes.rs runs each
# probe in this directory and fails when knots disagrees with a definition that
# is not listed here, or when a listed departure no longer occurs.
#
# A departure with no recorded reason is a bug: either in the implementation
# (fix knots) or in the record (the reason exists but isn't written here; cite
# it). status: "deliberate" (decided, with the reason below) or
# "decision pending".

[[departure]]
probe = "c/preproc_arms.c"
function = "f"
metric = "mccabe"
definition = 2
knots = 3
status = "decision pending"
reason = """knots counts decisions in every #if arm that is not constant-false, so the
score spans all configurations; the definition applies to one configuration at a
time (pmccabe keeps the first arm). Compare aurora-lint ADR-0010."""

[[departure]]
probe = "c/preproc_arms.c"
function = "f"
metric = "cognitive"
definition = 1
knots = 2
status = "decision pending"
reason = "Same cause as the McCabe entry for this probe: every #if arm is counted."
