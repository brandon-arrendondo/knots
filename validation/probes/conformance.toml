# Every known place where knots departs from a metric's published definition
# (docs/adr/0001-the-definition-is-the-authority.md). tests/probes.rs runs each
# probe in this directory and fails when knots disagrees with a definition that
# is not listed here, or when a listed departure no longer occurs.
#
# A departure with no recorded reason is a bug: either in the implementation
# (fix knots) or in the record (the reason exists but isn't written here; cite
# it). status: "deliberate" (decided, with the reason below) or
# "decision pending".

[[departure]]
probe = "rust/recursion.rs"
function = "depth"
metric = "cognitive"
definition = 2
knots = 1
status = "deliberate"
reason = """depth recurses only through `c.depth()`, a method call on a receiver whose
type knots can't see without type inference. Matching such calls by name alone
scored 4,554 of 13,882 functions in twelve crates.io crates as recursive (knots
e645961), nearly all delegations such as `self.0.fmt(f)` and `self.inner.hash(h)`;
with the edge dropped, 110 change against 1.18.0, and the sample checked were
real cycles or labeled jumps. Counted: bare calls, `self.name()`, `Self::name`
and `Type::name` (see src/recursion.rs)."""

[[departure]]
probe = "js/recursion.js"
function = "depth"
metric = "cognitive"
definition = 2
knots = 1
status = "deliberate"
reason = """The JavaScript form of rust/recursion.rs's depth, for the same reason: it
recurses only through `c.depth()`, and a receiver other than `this` has a type
knots can't see. Counted in JS/TS: bare calls, resolved through the enclosing
functions, and `this.name()` / `this.#name()` to the method's own class, where
`this` is the method's own (see src/recursion.rs)."""
