[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "knots"
description = "Multi-language code complexity analyzer with AI cost metrics (AIRD, AICP), SARIF/JSON/CSV output, and CI threshold enforcement"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Brandon Arrendondo" }]
keywords = ["complexity", "cyclomatic", "cognitive", "static-analysis", "ai"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/brandon-arrendondo/knots"
Repository = "https://github.com/brandon-arrendondo/knots"

# Standalone CLI distributed as a wheel: the `knots` binary is installed onto the
# environment's PATH (no pyo3 / Python module). The crate also has a plain rlib
# `[lib]` used internally by the binary; bindings = "bin" builds the binary only.
[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
